      <div id="filterResultView" class="col-12 col-lg-4 stickypos d-none d-lg-flex">
      <div class="stickypos-content">
        <div data-dojo-type="app/search/AppliedFilters" data-dojo-props="autoExpand:true"></div>
        <header class="g-search-panel__filters-header">
          <h2 class="g-search-panel__filters-title">
            ${i18n.search.spatialFilter.filterResults}
          </h2>
          <span aria-hidden="true" class="icon sprite-icons sprite-icons--sliders">
            <svg>
              <use xlink:href="/csdi-webpage/resources/2024-revamp/images/sprite-icons.svg#sliders"></use>
            </svg>
          </span>
        </header>
        <div data-dojo-type="app/search/PageUrlFilter"></div>

        <div class="g-filter-collapse" data-dojo-type="app/search/SpatialFilter"
          data-dojo-props="
            field: 'envelope_geo',
            pointField: 'envelope_cen_pt',
            allowAggregation: true,
            label:'${i18n.search.criteria.map}'">
        </div>

        <div class="g-filter-collapse" data-dojo-type="app/search/OnGeoAddress"

            open: false,
            label:'${i18n.search.criteria.ongeoaddress}'">
        </div>
        -->
        <div class="g-filter-collapse" data-dojo-type="app/search/CollectionsFilter"
          data-dojo-props="
            conditionallyDisabled: !AppContext.geoportal.supportsCollections,
            field:'src_collections_s',
            open:false,
            label:'${i18n.search.criteria.collections}'">
        </div>

        <div class="g-filter-collapse" data-dojo-type="app/search/TemporalFilter"
          data-dojo-props="
          	 conditionallyDisabled: !AppContext.geoportal.supportsTimePeriod,
             nestedPath:'timeperiod_nst', 
             field:'timeperiod_nst.begin_dt', 
             toField:'timeperiod_nst.end_dt', 
             interval:'year', 
             open:false, 
             label:'${i18n.search.criteria.timePeriod}'"> 
        </div>

        <div class="g-filter-collapse" data-dojo-type="app/search/TemporalFilter"
          data-dojo-props="
            conditionallyDisabled: !AppContext.geoportal.supportsDate,
            field:'sys_modified_dt',
            interval:'day',
            open:false,
            label:'${i18n.search.criteria.date}'">

		 <!-- e.g. field:'keywords_s',label:'Keywords',props:{size:20,min_doc_count:500} -->
		 
        <div class="g-filter-collapse" data-dojo-type="app/search/TermsAggregation"
          data-dojo-props="
            field: 'themes_s',
            label: '${i18n.search.criteria.topicFSDT}',
            props: {size:5000},
            open: true,
            autoCloseWhenEmpty: true">
        </div>

        <div class="g-filter-collapse" data-dojo-type="app/search/TermsAggregation"
          data-dojo-props="
            field: 'categories_s',
            label: '${i18n.search.criteria.topicCategory}',
            props: {size:5000},
            open: true,
            sortByName: true,
            sortByAmount: true,
            viewLimit: 5,
            autoCloseWhenEmpty: true">
        </div>

        <div class="g-filter-collapse" data-dojo-type="app/search/TermsAggregation"
