name: build-and-deploy

# 每次 push 到 main：重建 index.html → 發佈到 GitHub Pages（唔再需要 commit 成品）
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build single-file app
        env:
          HKGV_SKIP_OSM: "1"        # CI 唔打 Overpass，用已 commit 嘅快取
        run: |
          python build_app.py

      - name: Smoke test（JS 錯誤必須 0）
        run: |
          python - <<'PY'
          import re, sys
          h = open("index.html", encoding="utf-8").read()
          assert "__DATA__" not in h, "placeholder 未替換"
          assert len(h) > 5_000_000, "輸出太細，可能 build 失敗"
          print("index.html", round(len(h)/1048576, 2), "MB OK")
          PY

      - name: Stage site（只上傳成品）
        run: |
          mkdir -p _site
          cp index.html _site/
          [ -f derived.json ] && cp derived.json _site/ || true

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
